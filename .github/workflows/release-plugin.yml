name: release-plugin
run-name: "AI Switch 插件${{ inputs.dry_run && '验证' || '发布' }} · ${{ inputs.display_version || github.ref_name }}"

# 入口：
#  1) 推 v<版本> 标签 —— 正式发布。仓库变量 OTOOLS_PUBLISH_MARKET=true 时同步上架市场，
#     Release 与市场共用同一个 v<版本> 标签，资产链接不漂移。
#  2) 手动 dispatch —— 演练或补发。dry_run 默认 true，只构建、校验，不创建 Release / 不提交市场。
#     补发时把 release_tag 填为已推的 v<版本>，工作流据此检出同源提交，release-policy 会核对 SHA。
on:
  workflow_dispatch:
    inputs:
      display_version:
        description: "打包版本号（留空取 plugin.json）"
        default: ""
      release_tag:
        description: "复用已有标签（补发时填 v0.2.1，留空则按版本生成）"
        default: ""
      auth_mode:
        description: "市场认证方式"
        type: choice
        options: [pat, oidc, login, shared]
        default: pat
      publish_market:
        description: "同步插件市场（dry-run 时仅检查配置）"
        type: boolean
        default: false
      dry_run:
        description: "仅构建和校验，不创建 Release、不提交市场"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            library: Windows.dll
            suffix: windows
          - os: ubuntu-latest
            artifact: linux-x64
            library: Linux.so
            suffix: linux
          # 与 build-plugin.yml 一致：用移动别名，账户无法 provision 固定 macos-14。
          - os: macos-latest
            artifact: macos-arm64
            library: macOS.dylib
            suffix: macos
    outputs:
      version: ${{ steps.meta.outputs.version }}
      packid: ${{ steps.meta.outputs.packid }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      publish_enabled: ${{ steps.meta.outputs.publish_enabled }}
      market_requested: ${{ steps.meta.outputs.market_requested }}
      market_enabled: ${{ steps.meta.outputs.market_enabled }}
      validate_release: ${{ steps.meta.outputs.validate_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 校验版本、标签和发布开关
        id: meta
        env:
          DISPLAY_VERSION: ${{ inputs.display_version }}
          RELEASE_SOURCE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_MARKET: ${{ inputs.publish_market }}
          AUTO_PUBLISH_MARKET: ${{ vars.OTOOLS_PUBLISH_MARKET || 'false' }}
        run: node scripts/publish-market.mjs meta

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: node --test scripts/package.test.mjs scripts/publish-market.test.mjs scripts/release-policy.test.mjs
      - run: pnpm build
      - run: cargo test --manifest-path native/Cargo.toml --test plugin_boundary -- --test-threads=1
      - run: node scripts/build-native.mjs
      - run: python -I scripts/smoke-native.py --library lib/${{ matrix.library }}
      - run: python -I scripts/test_autostart.py
        env:
          OTOOLS_AI_SWITCH_TEST_LIBRARY: lib/${{ matrix.library }}
      - run: python -I scripts/test_nano_banana.py
        env:
          OTOOLS_AI_SWITCH_TEST_LIBRARY: lib/${{ matrix.library }}
      - run: node scripts/pack-plugin.mjs --suffix ${{ matrix.suffix }}
      - run: node scripts/verify-plugin.mjs --suffix ${{ matrix.suffix }} --expect-library lib/${{ matrix.library }}
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-native-${{ matrix.artifact }}
          path: dist-pack/
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-native-*
          path: artifacts

      - name: Assemble release assets
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PACKID: ${{ needs.build.outputs.packid }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for suffix in windows linux macos; do
            case "$suffix" in
              windows) dir=plugin-native-windows-x64 ;;
              linux) dir=plugin-native-linux-x64 ;;
              macos) dir=plugin-native-macos-arm64 ;;
            esac
            cp "artifacts/$dir/${PACKID}-${VERSION}-${suffix}.oplg" release-assets/
          done
          # 合包回退与 Windows 包同源（与既有发布一致）。
          cp "release-assets/${PACKID}-${VERSION}-windows.oplg" "release-assets/${PACKID}-${VERSION}.oplg"
          cp artifacts/plugin-native-windows-x64/plugin.json release-assets/
          cp artifacts/plugin-native-windows-x64/logo.svg release-assets/
          cd release-assets
          sha256sum "${PACKID}-${VERSION}.oplg" "${PACKID}-${VERSION}-windows.oplg" \
            "${PACKID}-${VERSION}-linux.oplg" "${PACKID}-${VERSION}-macos.oplg" \
            plugin.json logo.svg > SHA256SUMS
          cat SHA256SUMS

      - name: Verify assembled packages
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PACKID: ${{ needs.build.outputs.packid }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for f in *.oplg; do unzip -t "$f" >/dev/null; done
          cmp "${PACKID}-${VERSION}.oplg" "${PACKID}-${VERSION}-windows.oplg"
          test "$(sha256sum plugin.json | cut -d' ' -f1)" = "$(grep ' plugin.json$' SHA256SUMS | cut -d' ' -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    needs:
      - build
      - package
    if: ${{ needs.build.outputs.validate_release == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: 记录构建提交
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 市场凭证预检（不发送凭证、不上架）
        if: ${{ needs.build.outputs.market_requested == 'true' }}
        env:
          AUTH_MODE: ${{ inputs.auth_mode || vars.XYCLOUD_AUTH_MODE || 'pat' }}
          XYCLOUD_PAT: ${{ secrets.XYCLOUD_PAT }}
          XYCLOUD_LOGIN_TOKEN: ${{ secrets.XYCLOUD_LOGIN_TOKEN }}
          OTOOLS_MARKET_TOKEN: ${{ secrets.OTOOLS_MARKET_TOKEN }}
          XYCLOUD_OIDC_ISSUER: ${{ vars.XYCLOUD_OIDC_ISSUER }}
          XYCLOUD_PUBLISHER_ID: ${{ vars.XYCLOUD_PUBLISHER_ID }}
          OTOOLS_MARKET_API: ${{ vars.OTOOLS_MARKET_API }}
        run: node scripts/publish-market.mjs preflight

      - name: 核验发布标签与构建提交
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: node scripts/release-policy.mjs

      - name: 发布 GitHub Release
        if: ${{ needs.build.outputs.publish_enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '## AI Switch for OTools v%s\n\n由 release-plugin 工作流自动发布；三平台制品均通过构建与校验。\n' "$RELEASE_VERSION" > notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$COMMIT_SHA" \
              --title "AI Switch for OTools v${RELEASE_VERSION}" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" \
            release-assets/*.oplg release-assets/plugin.json release-assets/logo.svg release-assets/SHA256SUMS \
            --clobber

      - name: 授权并提交市场
        if: ${{ needs.build.outputs.market_enabled == 'true' }}
        env:
          AUTH_MODE: ${{ inputs.auth_mode || vars.XYCLOUD_AUTH_MODE || 'pat' }}
          XYCLOUD_PAT: ${{ secrets.XYCLOUD_PAT }}
          XYCLOUD_LOGIN_TOKEN: ${{ secrets.XYCLOUD_LOGIN_TOKEN }}
          OTOOLS_MARKET_TOKEN: ${{ secrets.OTOOLS_MARKET_TOKEN }}
          XYCLOUD_OIDC_ISSUER: ${{ vars.XYCLOUD_OIDC_ISSUER }}
          XYCLOUD_OIDC_AUDIENCE: ${{ vars.XYCLOUD_OIDC_AUDIENCE || 'otools-ci' }}
          XYCLOUD_PUBLISHER_ID: ${{ vars.XYCLOUD_PUBLISHER_ID }}
          OTOOLS_MARKET_API: ${{ vars.OTOOLS_MARKET_API }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PLUGIN_MANIFEST: release-assets/plugin.json
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PLATFORM_PACKAGES: '1'
        run: node scripts/publish-market.mjs

      - name: 发布摘要
        env:
          PUBLISH_ENABLED: ${{ needs.build.outputs.publish_enabled }}
          MARKET_ENABLED: ${{ needs.build.outputs.market_enabled }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          printf '### 发布检查完成\n- 正式发布：`%s`\n- 市场提交：`%s`\n- 标签：`%s`\n' "$PUBLISH_ENABLED" "$MARKET_ENABLED" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
