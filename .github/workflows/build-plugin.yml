name: Build plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            library: Windows.dll
            platform: windows
          - os: ubuntu-latest
            artifact: linux-x64
            library: Linux.so
            platform: linux
          - os: macos-14
            artifact: macos-arm64
            library: macOS.dylib
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: node --test scripts/package.test.mjs
      - run: pnpm build
      - run: cargo test --manifest-path native/Cargo.toml --test plugin_boundary -- --test-threads=1
      - run: node scripts/build-native.mjs
      - run: python -I scripts/smoke-native.py --library lib/${{ matrix.library }}
      - run: python -I scripts/test_autostart.py
        env:
          OTOOLS_AI_SWITCH_TEST_LIBRARY: lib/${{ matrix.library }}
      - run: python -I scripts/test_nano_banana.py
        env:
          OTOOLS_AI_SWITCH_TEST_LIBRARY: lib/${{ matrix.library }}
      # Each matrix job builds exactly one native library. Name the package by
      # platform and assert that no other platform's library leaked into it.
      - run: node scripts/pack-plugin.mjs --suffix ${{ matrix.platform }}
      - run: node scripts/verify-plugin.mjs --suffix ${{ matrix.platform }} --expect-library lib/${{ matrix.library }}
      - uses: actions/upload-artifact@v4
        with:
          name: otools-ai-switch-${{ matrix.artifact }}
          path: dist-pack/
          if-no-files-found: error
