[package]
name = "otools-ai-switch-native"
version = "0.1.2"
description = "AI Switch business core for the OTools native plugin ABI"
authors = ["xyito"]
edition = "2021"
autobins = false

[lib]
name = "otools_ai_switch_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
brotli = "8"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.20.2"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "sync", "process", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros", "chrono", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
directories = "5"
keyring = "3"
sha2 = "0.10"
argon2 = "0.5.3"
tempfile = "3"
url = "2"
axum = { version = "0.7", features = ["ws"] }
http-body-util = "0.1"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
tower-http = { version = "0.6", features = ["cors"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "system-proxy", "cookies", "stream", "socks"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
rcgen = { version = "0.13", features = ["x509-parser"] }
sha1 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
x509-parser = "0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Console"] }
winreg = "0.52"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_fs = "1"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("desktop"))', 'cfg(dev)'] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
